<!DOCTYPE html><html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guled AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }
    h1 { color: #35d6ff; }
    #chat {
      max-width: 500px;
      margin: 20px auto;
      background: #1e293b;
      padding: 15px;
      border-radius: 15px;
    }
    #messages {
      min-height: 200px;
      text-align: left;
      overflow-wrap: anywhere;
    }
    input {
      width: 65%;
      padding: 12px;
      border-radius: 8px;
      border: none;
    }
    button {
      padding: 12px;
      background: #35d6ff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🤖 Guled AI</h1>
  <p>Ku soo dhowow Guled AI!</p>  <div id="chat">
    <div id="messages">Guled AI: Salaan! Maxaan maanta kaa caawiyaa?</div>
    <input id="question" placeholder="Su'aashaada qor...">
    <button onclick="sendMessage()">Dir</button>
  </div>  <script>
    function sendMessage() {
      const input = document.getElementById("question");
      const messages = document.getElementById("messages");
      const question = input.value.trim();

      if (!question) return;

      messages.innerHTML += "<p><b>Adiga:</b> " +
        escapeHTML(question) + "</p>";

      messages.innerHTML +=
        "<p><b>Guled AI:</b> Waad mahadsan tahay! Noocan tijaabada ah weli kuma xirna AI dhab ah.</p>";

      input.value = "";
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script></body>
</html>
